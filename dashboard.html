<!DOCTYPE html><html><head><meta charset="UTF-8"><title>DPKP Jabar - OK</title></head>
<body style="font-family:sans-serif;padding:20px">
<h1 style="color:#0B3D91">DPKP JABAR - Kos Legal Dashboard</h1>
<p>Jika ini muncul berarti GitHub Pages SUDAH JALAN ✅</p>
<p>Total kos dari app.html: <b id="tot">0</b></p>
<div id="list"></div>
<script>
let data=JSON.parse(localStorage.getItem('KOS_V2')||'[]');
document.getElementById('tot').innerText=data.length;
document.getElementById('list').innerHTML=data.map(k=>`<div style="border:1px solid #ccc;padding:10px;margin:5px;border-radius:10px">${k.nama} - ${k.kamar} kamar - Rp ${k.harga}</div>`).join('')||'Belum ada data, buka app.html dulu';
</script>
<br><a href="app.html">Ke App Pemilik Kos</a> | <a href="index.html">Ke Pitch Deck</a>
</body></html>
